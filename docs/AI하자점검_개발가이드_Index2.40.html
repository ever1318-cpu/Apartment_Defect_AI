<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI하자점검 개발가이드 Index 2.40</title><style>body{font-family:"Malgun Gothic",Arial,sans-serif;margin:0;background:#edf3f8;color:#152534}.wrap{max-width:1180px;margin:auto;padding:28px}h1{margin:0 0 8px;color:#173f69}.meta{color:#527184}.doc{background:white;border-radius:14px;padding:14px;margin-top:18px;box-shadow:0 5px 18px #23415c12}iframe{width:100%;height:1900px;border:0;border-radius:8px}</style></head><body><main class="wrap"><h1>AI하자점검 개발가이드 Index 2.40</h1><p class="meta">최신 구현: IMU 기울기 + 이미지 수평경계 5부위 융합</p><section class="doc"><iframe title="IMU 이미지 경계 융합 구현보고서" srcdoc="&lt;!doctype html&gt;&lt;html lang=&quot;ko&quot;&gt;&lt;head&gt;&lt;meta charset=&quot;utf-8&quot;&gt;&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width,initial-scale=1&quot;&gt;&lt;title&gt;AI하자점검 IMU 이미지경계 5부위 융합 구현보고서 v1.0&lt;/title&gt;&lt;style&gt;body{font-family:&quot;Malgun Gothic&quot;,Arial,sans-serif;background:#f4f7fb;color:#162536;line-height:1.65;margin:0}.wrap{max-width:980px;margin:30px auto;background:#fff;padding:38px;border-radius:15px;box-shadow:0 6px 25px #1d3c5617}h1{margin:0;color:#173f69}h2{font-size:20px;border-left:5px solid #277c8c;padding-left:10px;margin-top:28px}.flow{display:flex;flex-wrap:wrap;gap:10px;background:#edf7f7;padding:16px;border-radius:10px;font-weight:700}.flow span{background:#fff;padding:7px 12px;border-radius:7px}table{border-collapse:collapse;width:100%;margin-top:10px}td,th{border:1px solid #d6e0e9;padding:10px;text-align:left}th{background:#edf4fb}.note{background:#fff5e8;padding:12px;border-left:4px solid #e88432}&lt;/style&gt;&lt;/head&gt;&lt;body&gt;&lt;main class=&quot;wrap&quot;&gt;&lt;h1&gt;AI하자점검 IMU 이미지경계 5부위 융합 구현보고서 v1.0&lt;/h1&gt;&lt;p&gt;구현일: 2026-08-03 / 대상: Android 하자사진 찍기 후 자동 부위 추정&lt;/p&gt;&lt;h2&gt;구현 내용&lt;/h2&gt;&lt;div class=&quot;flow&quot;&gt;&lt;span&gt;셔터 시점 IMU 피치&lt;/span&gt;&lt;span&gt;촬영 사진 상단/하단 수평경계&lt;/span&gt;&lt;span&gt;율합 신뢰도&lt;/span&gt;&lt;span&gt;5부위 후보&lt;/span&gt;&lt;span&gt;상세부위 메뉴&lt;/span&gt;&lt;/div&gt;&lt;ul&gt;&lt;li&gt;카메라 피치로 천장, 천장-벽, 벽, 벽-바닥, 바닥의 1차 후보를 결정한다.&lt;/li&gt;&lt;li&gt;근경 사진을 1/8로 축소한 후, 상단 1/3와 하단 1/3의 수평 경계 에너지를 계산한다.&lt;/li&gt;&lt;li&gt;상단 경계가 뚜렷하면 천장-벽, 하단 경계가 뚜렷하면 벽-바닥을 추천한다.&lt;/li&gt;&lt;li&gt;피치가 큰 천장/바닥 촬영은 IMU를 우선하고, 경계 정보는 신뢰도를 보완한다.&lt;/li&gt;&lt;/ul&gt;&lt;h2&gt;화면 적용&lt;/h2&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;항목&lt;/th&gt;&lt;th&gt;적용 방식&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;상세부위 제목&lt;/td&gt;&lt;td&gt;평면도 위치와 율합 부위를 &lt;b&gt;거실/벽&lt;/b&gt;, &lt;b&gt;주방/천장-벽&lt;/b&gt;처럼 표시&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;상세부위 기본값&lt;/td&gt;&lt;td&gt;서버 택소노미와 매칭된 최상위 후보를 즉시 선택&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;신뢰도&lt;/td&gt;&lt;td&gt;IMU와 이미지 경계가 일치하면 0.88, 경계가 부위를 보정하면 0.78, IMU만 있으면 0.68 기준&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;h2&gt;안전 장치&lt;/h2&gt;&lt;p class=&quot;note&quot;&gt;이미지 평면 분석은 현장 조명·재질에 따라 오탐이 가능하므로, 최종 선택은 점검자가 풀다운에서 변경할 수 있다. 수정된 결과는 재학습 Gold 라벨로 활용한다.&lt;/p&gt;&lt;h2&gt;검증&lt;/h2&gt;&lt;p&gt;Android Debug APK 빌드 성공. 실기기에서 천장, 코너, 벽, 걸레받이, 바닥 각 10장씩으로 오분류률을 확인하여 경계값(현재 0.18)을 보정한다.&lt;/p&gt;&lt;/main&gt;&lt;/body&gt;&lt;/html&gt;"></iframe></section></main></body></html>
