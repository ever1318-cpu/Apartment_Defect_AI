<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI하자점검 개발가이드 Index 2.41</title><style>body{font-family:"Malgun Gothic",Arial,sans-serif;margin:0;background:#edf3f8;color:#152534}.wrap{max-width:1180px;margin:auto;padding:28px}h1{margin:0 0 8px;color:#173f69}.meta{color:#527184}.doc{background:#fff;border-radius:14px;padding:14px;margin-top:18px;box-shadow:0 5px 18px #23415c12}iframe{width:100%;height:1700px;border:0;border-radius:8px}</style></head><body><main class="wrap"><h1>AI하자점검 개발가이드 Index 2.41</h1><p class="meta">최신 구현: 사진 경계선 시각화로 카메라 부위 판단 근거 표시</p><section class="doc"><iframe title="경계선 시각화 구현보고서" srcdoc="&lt;!doctype html&gt;&lt;html lang=&quot;ko&quot;&gt;&lt;head&gt;&lt;meta charset=&quot;utf-8&quot;&gt;&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width,initial-scale=1&quot;&gt;&lt;title&gt;AI하자점검 경계선 시각화 판단근거 구현보고서 v1.0&lt;/title&gt;&lt;style&gt;body{font-family:&quot;Malgun Gothic&quot;,Arial,sans-serif;background:#f4f7fb;color:#172535;line-height:1.65;margin:0}.wrap{max-width:940px;margin:30px auto;background:#fff;padding:38px;border-radius:15px;box-shadow:0 7px 26px #1d3c5516}h1{margin:0;color:#173f69}h2{font-size:20px;border-left:5px solid #277d8d;padding-left:10px;margin-top:30px}.card{background:#edf8f7;padding:15px;border-radius:10px;margin:12px 0}table{width:100%;border-collapse:collapse}td,th{border:1px solid #d5e1ea;padding:10px;text-align:left}th{background:#edf4fb}.line{height:4px;background:#ffb300;border-radius:4px;margin:8px 0}&lt;/style&gt;&lt;/head&gt;&lt;body&gt;&lt;main class=&quot;wrap&quot;&gt;&lt;h1&gt;AI하자점검 경계선 시각화 판단근거 구현보고서 v1.0&lt;/h1&gt;&lt;p&gt;적용 일자: 2026-08-03 / 대상: 하자사진 미리보기 및 사진 확대 뷰&lt;/p&gt;&lt;h2&gt;구현 결과&lt;/h2&gt;&lt;div class=&quot;card&quot;&gt;&lt;ul&gt;&lt;li&gt;IMU+이미지 율합으로 천장-벽 또는 벽-바닥 접합부가 검출되면 사진의 실제 Y 위치를 정규화해 저장한다.&lt;/li&gt;&lt;li&gt;하자의견 입력화면의 근경·원경 미니사진에 황색 경계선을 노출한다.&lt;/li&gt;&lt;li&gt;사진을 눌러 열리는 3장 캐러셀 확대뷰에서도 동일한 라인과 ‘천장-벽 경계’ 라벨을 표시한다.&lt;/li&gt;&lt;/ul&gt;&lt;div class=&quot;line&quot;&gt;&lt;/div&gt;&lt;p&gt;황색 라인 = AI가 판단 근거로 사용한 수평 접합선&lt;/p&gt;&lt;/div&gt;&lt;h2&gt;표시 원칙&lt;/h2&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;상태&lt;/th&gt;&lt;th&gt;사진 표시&lt;/th&gt;&lt;th&gt;상세부위 제목&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;천장-벽 추정&lt;/td&gt;&lt;td&gt;상단에 검출된 수평선&lt;/td&gt;&lt;td&gt;거실/천장-벽&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;벽-바닥 추정&lt;/td&gt;&lt;td&gt;하단에 검출된 수평선&lt;/td&gt;&lt;td&gt;거실/벽-바닥&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;평면 부위&lt;/td&gt;&lt;td&gt;경계 없음; IMU 기울기 기준&lt;/td&gt;&lt;td&gt;거실/천장, 거실/벽, 거실/바닥&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;h2&gt;데이터 보호&lt;/h2&gt;&lt;p&gt;경계선은 UI 오버레이이며 원본 사진 파일을 변경하지 않는다. 따라서 증거사진의 원본성과 전송 무결성을 유지한다.&lt;/p&gt;&lt;h2&gt;검증&lt;/h2&gt;&lt;p&gt;Android Debug APK 빌드 성공. 현장에서는 천장-벽, 벽-바닥 사진을 표본 촬영하여 라인이 접합부와 일치하는지 확인한다.&lt;/p&gt;&lt;/main&gt;&lt;/body&gt;&lt;/html&gt;"></iframe></section></main></body></html>
