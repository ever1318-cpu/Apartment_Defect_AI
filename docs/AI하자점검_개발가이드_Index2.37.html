<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI하자점검 개발가이드 Index 2.37</title><style>body{font-family:"Malgun Gothic",Arial,sans-serif;margin:0;background:#edf3f8;color:#152534}.wrap{max-width:1180px;margin:auto;padding:28px}h1{margin:0 0 8px;color:#173f69}.meta{color:#527184}.doc{background:white;border-radius:14px;padding:14px;margin-top:18px;box-shadow:0 5px 18px #23415c12}iframe{width:100%;height:1450px;border:0;border-radius:8px}</style></head><body><main class="wrap"><h1>AI하자점검 개발가이드 Index 2.37</h1><p class="meta">최신 변경: 상세부위 추천값 자동 적용 및 위치.부위 계층 제목</p><section class="doc"><iframe title="상세부위 적용보고서" srcdoc="&lt;!doctype html&gt;&lt;html lang=&quot;ko&quot;&gt;&lt;head&gt;&lt;meta charset=&quot;utf-8&quot;&gt;&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width,initial-scale=1&quot;&gt;&lt;title&gt;AI하자점검 상세부위 위치부위 계층 적용보고서 v1.0&lt;/title&gt;&lt;style&gt;body{font-family:&quot;Malgun Gothic&quot;,Arial,sans-serif;margin:0;background:#f4f7fb;color:#162235;line-height:1.65}.wrap{max-width:960px;margin:32px auto;background:#fff;padding:38px;border-radius:16px;box-shadow:0 8px 30px #1e35501a}h1{font-size:28px;margin:0 0 7px;color:#173f69}h2{font-size:20px;border-left:5px solid #287c8e;padding-left:10px;margin-top:30px}.tag{color:#37708b;font-weight:700}.card{background:#eef7f8;border-radius:10px;padding:15px;margin:12px 0}.example{font-size:20px;font-weight:700;color:#e96521;background:#fff6ef;padding:12px;border-radius:8px}ul{padding-left:22px}&lt;/style&gt;&lt;/head&gt;&lt;body&gt;&lt;main class=&quot;wrap&quot;&gt;&lt;h1&gt;AI하자점검 상세부위 위치부위 계층 적용보고서 v1.0&lt;/h1&gt;&lt;p class=&quot;tag&quot;&gt;적용 대상: Android 하자의견 입력 화면&lt;/p&gt;&lt;h2&gt;변경 요약&lt;/h2&gt;&lt;div class=&quot;card&quot;&gt;&lt;ul&gt;&lt;li&gt;AI/서버 추천 상세부위가 있으면 최상위 후보를 상세부위 선택값에 즉시 적용한다.&lt;/li&gt;&lt;li&gt;하자설명 입력창에는 위치·부위·상세부위를 포함한 초기 추천문구를 넣는다.&lt;/li&gt;&lt;li&gt;종전의 ‘상세부위 기본값/설명’ 안내 영역은 삭제한다.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;h2&gt;상세부위 선택창 제목&lt;/h2&gt;&lt;p&gt;제목은 평면도에서 파악한 공간 1개와, 카메라 각도에서 도출한 5개 부위 분류의 1개를 점(.)으로 연결한다.&lt;/p&gt;&lt;p class=&quot;example&quot;&gt;1. 거실.2. 벽&lt;/p&gt;&lt;p&gt;부위 분류: 천장, 천장-벽, 벽, 벽-바닥, 바닥. 제목 아래의 선택값은 추천 상세부위로 선선택되며, 점검자는 풀다운에서 다른 후보를 선택할 수 있다.&lt;/p&gt;&lt;h2&gt;동작 순서&lt;/h2&gt;&lt;ol&gt;&lt;li&gt;평면도/위치 추정으로 공간을 받는다.&lt;/li&gt;&lt;li&gt;카메라 자세로 부위를 추정한다.&lt;/li&gt;&lt;li&gt;서버 택소노미와 AI 후보 중 상위 5개를 상세부위 풀다운으로 제시한다.&lt;/li&gt;&lt;li&gt;최상위 후보를 자동 선택하고 모르면 자유입력으로 보완한다.&lt;/li&gt;&lt;/ol&gt;&lt;/main&gt;&lt;/body&gt;&lt;/html&gt;"></iframe></section></main></body></html>
