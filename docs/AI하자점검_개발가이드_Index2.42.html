uot;key&quot;&gt;장소:&lt;/span&gt; &lt;span class=&quot;value&quot;&gt;천장-벽&lt;/span&gt; &amp;nbsp; &lt;span class=&quot;key&quot;&gt;세부부위:&lt;/span&gt; &lt;span class=&quot;value&quot;&gt;천장 몰딩&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;key&quot;&gt;공종:&lt;/span&gt; &lt;span class=&quot;value&quot;&gt;창호·목공사&lt;/span&gt; &amp;nbsp; &lt;span class=&quot;key&quot;&gt;원인:&lt;/span&gt; &lt;span class=&quot;value&quot;&gt;시공 불량&lt;/span&gt;&lt;/div&gt;&lt;ul&gt;&lt;li&gt;위치, 장소, 세부부위, 공종, 원인을 의견 입력창 위에 명확히 표시한다.&lt;/li&gt;&lt;li&gt;항목명은 붉은색 계열, 추천·결과값은 기본 테마색으로 시각적으로 구분한다.&lt;/li&gt;&lt;li&gt;동일한 5단계 내용을 하자설명 초기 텍스트에도 자동 기입하여 점검자가 바로 수정·확정할 수 있게 한다.&lt;/li&gt;&lt;/ul&gt;&lt;h2&gt;값 생성 기준&lt;/h2&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;단계&lt;/th&gt;&lt;th&gt;출처&lt;/th&gt;&lt;th&gt;초기 값&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;위치&lt;/td&gt;&lt;td&gt;평면도 실 매칭, AR/PDR, 이미지 매칭&lt;/td&gt;&lt;td&gt;예: 거실&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;장소&lt;/td&gt;&lt;td&gt;IMU 기울기 + 이미지 경계 율합&lt;/td&gt;&lt;td&gt;예: 천장-벽&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;세부부위&lt;/td&gt;&lt;td&gt;PostgreSQL 택소노미 최상위 후보&lt;/td&gt;&lt;td&gt;예: 천장 몰딩&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;공종&lt;/td&gt;&lt;td&gt;택소노미 detail의 trade_label&lt;/td&gt;&lt;td&gt;예: 창호·목공사&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;원인&lt;/td&gt;&lt;td&gt;기본 추천 + 점검자 수정&lt;/td&gt;&lt;td&gt;예: 시공 불량&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;h2&gt;점검자 조작&lt;/h2&gt;&lt;p&gt;상세부위는 풀다운에서 최대 5개 후보를 선택할 수 있고, 모르면 자유입력으로 보완한다. 의견 입력창에서 내용을 직접 수정하면 원문 데이터로 보존된다.&lt;/p&gt;&lt;/main&gt;&lt;/body&gt;&lt;/html&gt;"></iframe></section></main></body></html>
